<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Label Print Program</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/login.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-box">

            <div class="login-header">
                <img src="/images/wb_logo.png" alt="Woobotech Logo" class="login-logo">
                <h1 class="login-title">WOOBOTECH WMS</h1>
                <p class="login-subtitle">Label Print System</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="id">ID</label>
                    <input type="text" id="id" name="username" placeholder="Enter your id">
                </div>
                <div class="form-group">
                    <label for="password">PW</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password">
                </div>

                <div class="form-group remember-group">
                    <label class="remember-label">
                        <input type="checkbox" id="rememberId">
                        <span>Remember ID</span>
                    </label>
                </div>

                <button type="submit" class="btn-login">Sign In</button>
            </form>
        </div>
    </div>

<script src="/js/login.js"></script>
</body>
</html>
