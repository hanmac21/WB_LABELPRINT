<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Label Print Program</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/modal.css">
    <link rel="stylesheet" href="/css/main.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/main.js"></script>
</head>
<header class="topbar">
    <div class="topbar-left">
        <img class="wooboTopLogo" src="../images/woobotechLogo2.png">
        <span class="db-name" id="dbName">-</span>
    </div>
    <div class="topbar-right">
        <button class="btn-logout" id="btnLogout">LOGOUT</button>
    </div>
</header>
<body>
    <!-- Search / Filter Panel -->
    <section class="filter-panel">
        <div class="filter-row">
            <!-- 좌측: 검색 영역 -->
            <div class="search-area">
                <div class="field">
                    <label for="itemtype">ITEM TYPE</label>
                    <input type="text" id="itemtype">
                </div>
                <div class="field">
                    <label for="car">CAR</label>
                    <input type="text" id="car">
                </div>
                <div class="field">
                    <label for="itemcode">ITEM CODE</label>
                    <input type="text" id="itemcode">
                </div>
                <div class="field">
                    <label for="spec">CUST CODE</label>
                    <input type="text" id="spec">
                </div>
                <div class="field">
                    <label for="itemname">ITEM NAME</label>
                    <input type="text" id="itemname">
                </div>
                <div class="field field-toggle">
                    <label>SCRAP</label>
                    <button type="button" class="toggle-btn" id="scrapToggle" aria-pressed="false">
                        <span class="toggle-track"><span class="toggle-thumb"></span></span>
                        <span class="toggle-text">EXCLUDE</span>
                    </button>
                </div>
                <div class="field thCname" style="display: none">
                    <label for="custname">CUSTOMER</label>
                    <input type="text" id="custname">
                </div>
            </div>

            <!-- SEARCH 버튼 -->
            <button class="btn-search" id="btnSearch">SEARCH</button>

            <!-- 중앙: 로트 정보 -->
            <div class="lot-area">
                <div class="lot-row">
                    <div class="field-v">
                        <label class="label-accent">SUPPLIER</label>
                        <select id="supplier">
                            <!-- 동적으로 추가 -->
                        </select>
                    </div>

                    <!-- PT 전용: 기본 숨김 -->
                    <div class="field-v" id="ptExtraWrap" style="display:none;">
                        <label class="label-accent">LABEL TYPE</label>
                        <select id="ptExtra">
                            <!-- 동적으로 추가 -->
                        </select>
                        <div class="guide-example" id="ptExample" style="visibility:hidden;"></div>
                    </div>
                </div>
                <div class="lot-row">
                    <div class="field-v">
                        <label class="label-accent">LOT DATE</label>
                        <input type="date" id="lotDate">
                    </div>
                    <div class="field-v">
                        <label>LOTNO</label>
                        <div class="input-with-spinner">
                            <input type="text" id="lotno" value="00001" class="readonly-input" readonly>
                            <div class="input-spinner" id="lotnoSpinner"></div>
                        </div>
                    </div>
                    <div class="field-v">
                        <label>LOTQTY</label>
                        <input type="number" id="lotQty" value="1" min="1" class="num-input">
                    </div>
                    <div class="field-v">
                        <label>PRINT QTY</label>
                        <input type="number" id="printQty" value="1" min="1" max="100" class="num-input">
                    </div>
                </div>
            </div>

            <!-- 우측: PRINT 영역 -->
            <div class="print-area">
                <button class="btn-print" id="btnPrint">PRINT</button>
                <div class="total-qty">
                    <span class="total-label">TOTAL QTY</span>
                    <span class="total-value" id="totalQty">0</span>
                </div>
            </div>

            <!-- 가이드 영역 -->
            <div class="guide-area">
                <div class="guide-text">
                    <div>ADD DOCUMENT GUIDE</div>
                    <div class="guide-line" data-option="OFF">OFF : NONE</div>
                    <div class="guide-line" data-option="PALLET">PALLET : MATERIAL</div>
                    <div class="guide-line" data-option="BOX">BOX : PRODUCT(ASSY)</div>
                    <div class="guide-example" id="guideExample"></div>
                </div>
                <select class="guide-select" id="guideOption">
                    <option>OFF</option>
                    <option>PALLET</option>
                    <option>BOX</option>
                </select>
            </div>
            <!-- <button class="btn-settings" aria-label="Settings">⚙</button> -->
        </div>
    </section>

    <!-- Data Table -->
    <section class="table-section">
        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="col-no">NO</th>
                        <th class="col-cname thCname" style="display:none;">CUSTOMER</th>
                        <th class="col-itemtype">ITEM TYPE</th>
                        <th class="col-car">CAR</th>
                        <th class="col-code">ITEM CODE</th>
                        <th class="col-spec">CUSTOMER CODE</th>
                        <th class="col-name">ITEM NAME</th>
                        <th class="col-unit">UNIT</th>
                    </tr>
                </thead>
                <tbody id="itemTableBody">
                    <!-- 동적으로 추가 -->
                </tbody>
            </table>
        </div>
    </section>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>


    <!-- Print Modal -->
    <div id="printModal" class="print-modal-overlay">
        <div class="print-modal-box">
            <div class="print-modal-header">PRINT LABEL</div>
            <div class="print-modal-body">
                <p class="print-modal-guide">Select a label to print.</p>
                <div id="printModalButtons" class="print-modal-buttons">
                    <!-- 동적으로 버튼 추가 -->
                </div>
            </div>
            <div class="print-modal-footer">
                <button class="print-modal-btn print-modal-close" id="printModalClose">CLOSE</button>
            </div>
        </div>
    </div>
</body>
</html>
