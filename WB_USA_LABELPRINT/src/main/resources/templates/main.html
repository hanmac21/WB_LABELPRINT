<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Label Print Program</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- Search / Filter Panel -->
    <section class="filter-panel">
        <div class="filter-row">

            <!-- 좌측: 검색 영역 -->
            <div class="search-area">
                <div class="field">
                    <label for="itemcode">ITEM CODE</label>
                    <input type="text" id="itemcode">
                </div>
                <div class="field">
                    <label for="spec">CUSTOMER CODE</label>
                    <input type="text" id="spec">
                </div>
                <div class="field">
                    <label for="itemname">ITEM NAME</label>
                    <input type="text" id="itemname">
                </div>
            </div>

            <!-- SEARCH 버튼 -->
            <button class="btn-search" id="btnSearch">SEARCH</button>

            <!-- 중앙: 로트 정보 -->
            <div class="lot-area">
                <div class="field">
                    <label class="label-accent">SUPPLIER</label>
                    <select id="supplier">
                        <option>WBTM</option>
                    </select>
                </div>
                <div class="lot-row">
                    <div class="field-v">
                        <label class="label-accent">LOT DATE</label>
                        <input type="date" id="lotDate">
                    </div>
                    <div class="field-v">
                        <label>LOTNO</label>
                        <div class="input-with-spinner">
                            <input type="text" id="lotno" value="00001" class="readonly-input" readonly>
                            <div class="input-spinner" id="lotnoSpinner"></div>
                        </div>
                    </div>
                    <div class="field-v">
                        <label>LOTQTY</label>
                        <input type="number" id="lotQty" value="1" min="1" class="num-input">
                    </div>
                    <div class="field-v">
                        <label>PRINT QTY</label>
                        <input type="number" id="printQty" value="1" min="1" max="100" class="num-input">
                    </div>
                </div>
            </div>

            <!-- 우측: PRINT 영역 -->
            <div class="print-area">
                <button class="btn-print" id="btnPrint">PRINT</button>
                <div class="total-qty">
                    <span class="total-label">TOTAL QTY</span>
                    <span class="total-value" id="totalQty">0</span>
                </div>
            </div>

            <!-- 가이드 영역 -->
            <div class="guide-area">
                <div class="guide-text">
                    <div>ADD DOCUMENT GUIDE</div>
                    <div>OFF : NONE</div>
                    <div>PALLET : MATERIAL</div>
                    <div>BOX : PRODUCT(ASSY)</div>
                </div>
                <select class="guide-select" id="guideOption">
                    <option>OFF</option>
                </select>
                <button class="btn-settings" aria-label="Settings">⚙</button>
            </div>

        </div>
    </section>

    <!-- Data Table -->
    <section class="table-section">
        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="col-no">NO</th>
                        <th class="col-car">CAR</th>
                        <th class="col-code">ITEM CODE</th>
                        <th class="col-spec">CUSTOMER CODE</th>
                        <th class="col-name">ITEM NAME</th>
                        <th class="col-unit">UNIT</th>
                    </tr>
                </thead>
                <tbody id="itemTableBody">
                    <!-- 동적으로 추가 -->
                </tbody>
            </table>
        </div>
    </section>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
