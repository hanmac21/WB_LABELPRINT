spring.application.name=WB_USA_LABELPRINT

server.port=8181
spring.thymeleaf.cache=false

# USA DB
spring.datasource.url=jdbc:log4jdbc:oracle:thin:@45.58.2.218:1521:WBUSA
spring.datasource.username=wbusa
spring.datasource.password=woobo23300usa
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy

# Mybatis Settings
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.type-aliases-package=com.example.wb_usa_labelprint


# templates 폴더를 소스 경로에서 직접 읽기
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.thymeleaf.suffix=.html

# static 파일도 소스 경로에서 직접 읽기
spring.web.resources.static-locations=file:src/main/resources/static/
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false


logging.level.log4jdbc.log4j2=off
logging.level.root=info
logging.level.jdbc=off
logging.level.jdbc.sqlonly=info
logging.level.jdbc.sqltiming=off
logging.level.jdbc.resultsettable=info
logging.level.jdbc.audit=off
logging.level.jdbc.resultset=off
logging.level.jdbc.connection=off